<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
      .card {
        width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 24px 28px; border-radius: 20px;
        background: radial-gradient(140% 120% at 50% 0%, #1a1a2e 0%, #0a0a0f 65%, #070B14 100%);
        border: 1px solid rgba(56,207,255,0.12); box-shadow: 0 24px 60px rgba(0,0,0,0.6);
      }
      .logo { width: 64px; height: 64px; object-fit: cover; border-radius: 16px; box-shadow: 0 0 24px rgba(56,207,255,0.2); }
      .title { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
      .subtitle { font-size: 11.5px; color: rgba(255,255,255,0.5); text-align: center; max-width: 340px; line-height: 1.5; }
      .steps { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
      .step { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: rgba(255,255,255,0.6); }
      .step .dot { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; flex-shrink: 0; }
      .step.pending .dot { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); }
      .step.running .dot { background: rgba(56,207,255,0.15); color: #38CFFF; animation: pulse 1s ease-in-out infinite; }
      .step.done .dot { background: rgba(34,197,94,0.15); color: #22c55e; }
      .step.fail .dot { background: rgba(239,68,68,0.15); color: #ef4444; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
      .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
      .btn { padding: 7px 14px; border-radius: 8px; font-size: 11.5px; font-weight: 600; cursor: pointer; border: none; }
      .btn-primary { background: #38CFFF; color: #000; }
      .btn-ghost { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.08); }
      .detail { font-size: 10px; color: rgba(255,255,255,0.35); font-family: 'JetBrains Mono', monospace; max-width: 340px; word-break: break-all; text-align: center; }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="../build/icon.png" alt="MYRAA" onerror="this.style.display='none'" />
      <div class="title" id="recovery-title">MYRAA is starting…</div>
      <div class="subtitle" id="recovery-subtitle">Checking installation and resolving paths.</div>
      <div class="steps" id="recovery-steps"></div>
      <div class="detail" id="recovery-detail"></div>
      <div class="actions" id="recovery-actions" style="display:none;">
        <button class="btn btn-primary" id="btn-retry">Retry</button>
        <button class="btn btn-ghost" id="btn-browse">Browse…</button>
        <button class="btn btn-ghost" id="btn-repair">Repair</button>
      </div>
    </div>
    <script>
      const { ipcRenderer } = require('electron');
      const stepsEl = document.getElementById('recovery-steps');
      const titleEl = document.getElementById('recovery-title');
      const subEl = document.getElementById('recovery-subtitle');
      const detailEl = document.getElementById('recovery-detail');
      const actionsEl = document.getElementById('recovery-actions');

      function renderSteps(steps) {
        stepsEl.innerHTML = steps.map(s => {
          let cls = 'pending';
          if (s.startsWith('\u2713') || s.includes('✓')) cls = 'done';
          else if (s.startsWith('\u2717') || s.includes('✗') || s.includes('FAIL')) cls = 'fail';
          else if (s.includes('Checking') || s.includes('Resolving') || s.includes('Verifying')) cls = 'running';
          const icon = cls === 'done' ? '✓' : cls === 'fail' ? '✗' : cls === 'running' ? '◷' : '○';
          return `<div class="step ${cls}"><span class="dot">${icon}</span><span>${s.replace(/^[✓✗◷○]\s*/, '').replace(/^\[\d\/6\]\s*/, '')}</span></div>`;
        }).join('');
      }

      ipcRenderer.on('myraa:recovery-update', (_ev, data) => {
        if (data.title) titleEl.textContent = data.title;
        if (data.subtitle) subEl.textContent = data.subtitle;
        if (data.steps) renderSteps(data.steps);
        if (data.detail) detailEl.textContent = data.detail;
        if (data.showActions) actionsEl.style.display = 'flex';
      });

      document.getElementById('btn-retry').addEventListener('click', () => ipcRenderer.invoke('myraa:recovery-retry'));
      document.getElementById('btn-browse').addEventListener('click', () => ipcRenderer.invoke('myraa:recovery-browse'));
      document.getElementById('btn-repair').addEventListener('click', () => ipcRenderer.invoke('myraa:recovery-repair'));
    </script>
  </body>
</html>
